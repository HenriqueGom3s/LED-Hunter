<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Hunter</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#155eef;--border:#d9e1ec;--green:#12b76a;--yellow:#f79009;--blue:#2e90fa}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fafc);color:var(--text)}
button,input{font:inherit}.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:24px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px #10182812}
.login{max-width:430px;margin:8vh auto;padding:32px}.brand{font-size:30px;font-weight:800;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 26px}
label{display:block;font-weight:700;font-size:14px;margin:15px 0 7px}input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;outline:none}input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #155eef18}
.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:#fff}.secondary{background:#eef2f6;color:#344054}.danger{background:#fee4e2;color:#b42318}
.full{width:100%;margin-top:20px}.msg{margin-top:15px;padding:11px 12px;border-radius:10px;font-size:14px;background:#f2f4f7;color:#344054}.msg.error{background:#fef3f2;color:#b42318}.msg.ok{background:#ecfdf3;color:#027a48}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.title{font-size:28px;font-weight:800}.user{color:var(--muted);font-size:13px}
.toolbar{padding:18px;display:grid;grid-template-columns:1fr 170px 150px;gap:10px;margin-bottom:18px}.toolbar input,.toolbar select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.lead{padding:17px}.lead h3{margin:0 0 8px;font-size:18px}.lead p{margin:6px 0;color:#475467;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.status{font-size:12px;font-weight:800;border-radius:999px;padding:5px 9px;display:inline-block;margin-bottom:10px}.cli{background:#dcfae6;color:#067647}.outro{background:#fef0c7;color:#b54708}.nao{background:#f2f4f7;color:#344054}.trat{background:#d1e9ff;color:#175cd3}
.topnote{font-size:13px;color:var(--muted);margin:0 0 15px}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:800px){.toolbar{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>

<section id="loginScreen" class="wrap">
  <div class="card login">
    <div class="brand">LED Hunter</div>
    <p class="subtitle">Acesso ao sistema de leads</p>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" class="btn primary full" type="submit">Entrar</button>
      <div id="loginMsg" class="msg hidden"></div>
    </form>
  </div>
</section>

<section id="appScreen" class="wrap hidden">
  <header>
    <div>
      <div class="title">LED Hunter</div>
      <div class="user" id="userLabel"></div>
    </div>
    <button id="logoutBtn" class="btn secondary">Sair</button>
  </header>

  <div class="card toolbar">
    <input id="searchInput" placeholder="Pesquisar empresa/lead...">
    <select id="statusFilter">
      <option value="">Todos os status</option>
      <option value="cli">Cliente captado</option>
      <option value="outro">Cliente de outro vendedor</option>
      <option value="nao">Sem contato</option>
      <option value="trat">Em tratativa</option>
    </select>
    <button id="clearBtn" class="btn danger">Limpar tela</button>
  </div>

  <p class="topnote" id="syncLabel">Conectando ao banco...</p>
  <div id="results" class="results"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

const SUPABASE_URL = "https://xzlxyyzdozvpetcqjmhv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_sB7MVLJhTmgCBvcIBznq5A_-P43B6re";

let client = null;
let allLeads = [];
let visibleLeads = [];
let realtimeChannel = null;

const $ = id => document.getElementById(id);
const loginScreen = $('loginScreen');
const appScreen = $('appScreen');
const loginForm = $('loginForm');
const loginBtn = $('loginBtn');
const loginMsg = $('loginMsg');
const results = $('results');
const searchInput = $('searchInput');
const statusFilter = $('statusFilter');
const syncLabel = $('syncLabel');

function showLoginMessage(text, type='error'){
  loginMsg.textContent = text;
  loginMsg.className = 'msg ' + type;
}
function clearLoginMessage(){ loginMsg.textContent=''; loginMsg.className='msg hidden'; }

function showLogin(){
  appScreen.classList.add('hidden');
  loginScreen.classList.remove('hidden');
}
function showApp(user){
  loginScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');
  $('userLabel').textContent = user && user.email ? user.email : '';
}

function statusLabel(s){
  return ({cli:'Cliente captado',outro:'Cliente de outro vendedor',nao:'Sem contato',trat:'Em tratativa'})[s] || 'Sem contato';
}
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function render(){
  const q=(searchInput.value||'').trim().toLowerCase();
  const f=statusFilter.value;
  visibleLeads=allLeads.filter(l=>{
    const text=[l.nome,l.telefone,l.website,l.endereco,l.categoria,l.cidade].join(' ').toLowerCase();
    return (!q || text.includes(q)) && (!f || l.status===f);
  });
  if(!visibleLeads.length){results.innerHTML='<div class="card empty">Nenhum lead para exibir.</div>';return;}
  results.innerHTML=visibleLeads.map(l=>`
    <article class="card lead">
      <span class="status ${esc(l.status||'nao')}">${esc(statusLabel(l.status||'nao'))}</span>
      <h3>${esc(l.nome)}</h3>
      <p>${esc(l.endereco||'Endereço não informado')}</p>
      ${l.telefone?`<p>Telefone: ${esc(l.telefone)}</p>`:''}
      ${l.website?`<p>Site: ${esc(l.website)}</p>`:''}
      <div class="actions">
        <button class="btn secondary" data-status="cli" data-id="${esc(l.place_id)}">Cliente captado</button>
        <button class="btn secondary" data-status="outro" data-id="${esc(l.place_id)}">Outro vendedor</button>
        <button class="btn secondary" data-status="nao" data-id="${esc(l.place_id)}">Sem contato</button>
        <button class="btn secondary" data-status="trat" data-id="${esc(l.place_id)}">Em tratativa</button>
      </div>
    </article>`).join('');
}

async function loadLeads(){
  syncLabel.textContent='Consultando banco online...';
  const {data,error}=await client.from('led_hunter_leads').select('*').order('updated_at',{ascending:false});
  if(error) throw error;
  allLeads=(data||[]).map(r=>({
    id:r.id,place_id:r.place_id,nome:r.nome||'',telefone:r.telefone||'',website:r.website||'',
    endereco:r.endereco||'',categoria:r.categoria||'',cidade:r.cidade||'',
    status:r.status||'nao',updated:r.updated_at
  }));
  localStorage.setItem('ledHunterLeads',JSON.stringify(allLeads));
  syncLabel.textContent='Banco online conectado • '+allLeads.length+' lead(s)';
  render();
}

async function setStatus(placeId,status){
  const lead=allLeads.find(x=>x.place_id===placeId);
  if(!lead)return;
  const old=lead.status;
  lead.status=status;
  render();
  const {data:{user}}=await client.auth.getUser();
  const {error}=await client.from('led_hunter_leads').upsert({
    place_id:lead.place_id,nome:lead.nome,telefone:lead.telefone,website:lead.website,
    endereco:lead.endereco,categoria:lead.categoria,cidade:lead.cidade,status,
    updated_at:new Date().toISOString(),updated_by:user ? user.id : null
  },{onConflict:'place_id'});
  if(error){
    lead.status=old; render();
    alert('Não foi possível salvar o status: '+error.message);
  }
}

async function initRealtime(){
  if(realtimeChannel) return;
  realtimeChannel=client.channel('led-hunter-leads')
    .on('postgres_changes',{event:'*',schema:'public',table:'led_hunter_leads'},()=>loadLeads().catch(e=>console.error(e)))
    .subscribe();
}

async function startApp(user){
  showApp(user);
  try{
    await loadLeads();
    await initRealtime();
  }catch(e){
    console.error(e);
    syncLabel.textContent='Erro ao carregar o banco: '+e.message;
  }
}

async function boot(){
  if(!window.supabase){
    showLoginMessage('Não foi possível carregar o Supabase. Verifique a conexão com a internet.');
    return;
  }
  try{
    client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
    const {data:{session},error}=await client.auth.getSession();
    if(error) throw error;
    if(session && session.user) await startApp(session.user);
    else showLogin();
    client.auth.onAuthStateChange(async (event,session)=>{
      if(event==='SIGNED_IN' && session && session.user) await startApp(session.user);
      if(event==='SIGNED_OUT') showLogin();
    });
  }catch(e){
    console.error(e);
    showLoginMessage('Erro ao iniciar autenticação: '+e.message);
  }
}

loginForm.addEventListener('submit',async function(ev){
  ev.preventDefault();
  clearLoginMessage();
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email || !password){showLoginMessage('Informe e-mail e senha.');return;}
  loginBtn.disabled=true;
  loginBtn.textContent='Entrando...';
  try{
    if(!client) throw new Error('Supabase ainda não foi carregado.');
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(data && data.user) showLoginMessage('Login realizado. Carregando...','ok');
  }catch(e){
    console.error('LOGIN ERROR',e);
    showLoginMessage('Erro no login: '+(e.message||'Não foi possível entrar.'));
  }finally{
    loginBtn.disabled=false;
    loginBtn.textContent='Entrar';
  }
});

$('logoutBtn').addEventListener('click',async()=>{
  if(client) await client.auth.signOut();
});

$('clearBtn').addEventListener('click',()=>{
  allLeads=[];
  render();
  syncLabel.textContent='Tela limpa. Os leads continuam salvos no banco.';
});

searchInput.addEventListener('input',render);
statusFilter.addEventListener('change',render);
results.addEventListener('click',e=>{
  const btn=e.target.closest('[data-status]');
  if(btn) setStatus(btn.dataset.id,btn.dataset.status);
});

boot();
})();
</script>
</body>
</html>
